<!DOCTYPE html>
<html>
<head>
  <base target="_top">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #2e7d32;
    }

    .bloc {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    h2 {
      color: #2e7d32;
    }

    label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    textarea {
      height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      background: #2e7d32;
      color: white;
      border: none;
      padding: 15px;
      font-size: 18px;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #1b5e20;
    }

    #resultat {
      margin-top: 20px;
      padding: 15px;
      background: white;
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

<h1>🏃 Coach Santé Personnel</h1>

<div class="bloc">
  <h2>Santé</h2>

  <label>Poids (kg)</label>
  <input type="number" id="poids">

  <label>Sommeil (heures)</label>
  <input type="number" id="sommeil">

  <label>Fatigue (0 à 10)</label>
  <input type="number" min="0" max="10" id="fatigue">

  <label>Stress (0 à 10)</label>
  <input type="number" min="0" max="10" id="stress">
</div>

<div class="bloc">
  <h2>Activité Physique</h2>

  <label>Nombre de pas</label>
  <input type="number" id="pas">

  <label>Sport (minutes)</label>
  <input type="number" id="sport">

  <label>Temps assis (heures)</label>
  <input type="number" id="assis">

  <label>Temps en voiture (heures)</label>
  <input type="number" id="voiture">
</div>

<div class="bloc">
  <h2>Travail</h2>

  <label>Heures travaillées</label>
  <input type="number" id="travail">
</div>

<div class="bloc">
  <h2>Développement Personnel</h2>

  <label>Lecture (minutes)</label>
  <input type="number" id="lecture">

  <label>Formation (minutes)</label>
  <input type="number" id="formation">
</div>

<div class="bloc">
  <h2>Notes de la journée</h2>

  <textarea id="notes" placeholder="Exemple : Réunion difficile ce matin, bonne séance de vélo ce soir..."></textarea>
</div>

<button onclick="enregistrer()">
✅ Enregistrer ma journée
</button>

<div id="resultat"></div>

<script>

function enregistrer() {

  const data = {

    poids: document.getElementById("poids").value,
    sommeil: document.getElementById("sommeil").value,
    fatigue: document.getElementById("fatigue").value,
    stress: document.getElementById("stress").value,
    pas: document.getElementById("pas").value,
    sport: document.getElementById("sport").value,
    assis: document.getElementById("assis").value,
    voiture: document.getElementById("voiture").value,
    travail: document.getElementById("travail").value,
    lecture: document.getElementById("lecture").value,
    formation: document.getElementById("formation").value,
    notes: document.getElementById("notes").value

  };

  document.getElementById("resultat").innerHTML =
    "⏳ Enregistrement en cours...";

  google.script.run
    .withSuccessHandler(function(message) {

      document.getElementById("resultat").innerHTML = message;

      document.querySelectorAll("input").forEach(i => i.value = "");
      document.getElementById("notes").value = "";

    })
    .withFailureHandler(function(error) {

      document.getElementById("resultat").innerHTML =
        "❌ Erreur : " + error.message;

    })
    .enregistrerDonnees(data);
}

</script>

</body>
</html>
``
